    <script>
      const resultado=(()=>{try{return JSON.parse(sessionStorage.getItem('boloObrigado')||'null')}catch{return null}})();
      const valido=resultado&&typeof resultado.id==='string'&&/^[0-9a-f]{8}-[0-9a-f-]{27,}$/.test(resultado.id)&&Number.isInteger(resultado.valor_cents)&&resultado.valor_cents>0&&['pago','comprovante'].includes(resultado.tipo);
      if(valido){
        document.getElementById('titulo').textContent='Pedido recebido!';
        document.getElementById('mensagem').textContent=resultado.tipo==='pago'?'Pagamento confirmado. Entraremos em contato para confirmar seu pedido.':'Comprovante recebido. Aguardamos a confirmação do pagamento para preparar seu pedido.';
        document.getElementById('numero').textContent=resultado.id;
        document.getElementById('pedido').hidden=false;
        function dispararConversao(){
          if(resultado.tipo!=='pago')return;
          const dados={value:resultado.valor_cents/100,currency:'BRL',transaction_id:resultado.id};
          const destinos=['AW-18488279914/96mCCL6npY0dEOqG8-9E','AW-18503806902/55F4CMOhjpcdELbfpvdE'];
          destinos.forEach((destino)=>{
            const chave='boloPurchaseConversao:'+destino+':'+resultado.id;
            if(sessionStorage.getItem(chave)==='enviada')return;
            if(!window.enviarConversaoGoogle?.(destino,dados))return;
            sessionStorage.setItem(chave,'enviada');
          });
        }
        window.addEventListener('ads-consent-change',dispararConversao);
        dispararConversao();
      }
    </script>
